<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS 5.28.1 — Assistant + Sécurité</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0ff;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      gap: 20px;
      padding: 20px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 14, 39, 0.95);
      padding: 15px 20px;
      border-bottom: 2px solid #00d9ff;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #00d9ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title svg {
      width: 30px;
      height: 30px;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .version {
      font-size: 12px;
      color: #888;
    }

    .main-content {
      display: flex;
      gap: 20px;
      margin-top: 70px;
      height: calc(100vh - 110px);
    }

    /* Left Panel: Chat */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(20, 25, 45, 0.8);
      border: 1px solid #00d9ff;
      border-radius: 12px;
      overflow: hidden;
    }

    .chat-header {
      background: rgba(0, 217, 255, 0.1);
      padding: 15px;
      border-bottom: 1px solid #00d9ff;
      font-weight: bold;
      color: #00d9ff;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      max-width: 90%;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(0, 217, 255, 0.2);
      border-left: 3px solid #00d9ff;
      color: #fff;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(100, 200, 255, 0.1);
      border-left: 3px solid #64c8ff;
      color: #e0e0ff;
    }

    .message.loading {
      color: #888;
      font-style: italic;
    }

    .chat-input-area {
      padding: 15px;
      border-top: 1px solid #00d9ff;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #00d9ff;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      max-height: 80px;
    }

    .chat-input::placeholder {
      color: #666;
    }

    .chat-input:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
    }

    .send-btn {
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      border: none;
      color: #000;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .send-btn:hover:not(:disabled) {
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Right Panel: Mitigations */
    .mitigations-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
    }

    .mitigations-title {
      color: #00d9ff;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .mitigation-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .mitigation-card {
      background: rgba(20, 25, 45, 0.8);
      border: 1px solid #00d9ff;
      border-radius: 12px;
      padding: 15px;
      transition: all 0.3s;
    }

    .mitigation-card:hover {
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
    }

    .mitigation-title {
      color: #00d9ff;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .mitigation-desc {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .test-btn {
      width: 100%;
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      border: 1px solid #00d9ff;
      color: #000;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
    }

    .test-btn:hover:not(:disabled) {
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    .test-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .response-output {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid #00ff00;
      border-radius: 6px;
      font-size: 12px;
      color: #00ff00;
      font-family: monospace;
      max-height: 120px;
      overflow-y: auto;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 14, 39, 0.95);
      padding: 10px 20px;
      border-top: 2px solid #00d9ff;
      font-size: 12px;
      color: #666;
      text-align: right;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 217, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 217, 255, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 217, 255, 0.6);
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#00d9ff" stroke-width="2"/>
        <circle cx="50" cy="50" r="35" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.5"/>
        <circle cx="50" cy="50" r="25" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
        <circle cx="50" cy="50" r="8" fill="#00d9ff"/>
      </svg>
      JARVIS 5.28.1
    </div>
    <div class="version">Assistant + Sécurité</div>
  </header>

  <div class="container">
    <!-- Chat Panel -->
    <div class="chat-panel">
      <div class="chat-header">💬 Assistant Jarvis</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <textarea
          id="userInput"
          class="chat-input"
          placeholder="Pose une question à Jarvis..."
          rows="3"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Envoyer</button>
      </div>
    </div>

    <!-- Mitigations Panel -->
    <div class="mitigations-panel">
      <div class="mitigations-title">🔒 Mitigations Sécurité</div>
      <div class="mitigation-grid" id="mitigationGrid"></div>
    </div>
  </div>

  <footer id="footer">v5.28.1 · Déploiement live Render · API Anthropic</footer>

  <script>
    const API_URL = window.location.origin + '/api/complete';
    const mitigations = [
      {
        id: 'M1',
        title: 'M1 — Audit agrégé',
        desc: 'Les refus de permission sont désormais agrégés exponentiellement pour éviter le débordement du journal.',
        prompt: 'Explique comment M1 (Audit agrégé) fonctionne dans Jarvis 5.28.1. Quels exploits cela bloque?'
      },
      {
        id: 'M2',
        title: 'M2 — Sceau étendu',
        desc: 'Le scellement de provenance couvre maintenant tous les champs de politique (args, argsScope, maxRate, parentId).',
        prompt: 'Comment M2 (Sceau étendu) renforce la provenance des arguments dans Jarvis?'
      },
      {
        id: 'M3',
        title: 'M3 — Filiation par puissance',
        desc: 'Deux permissions de même puissance ne peuvent plus coexister sans filiation déclarée.',
        prompt: 'Explique la mitigation M3 (Filiation par puissance). Quel exploit cela empêche?'
      },
      {
        id: 'M4',
        title: 'M4 — Arguments validés',
        desc: 'Parcours récursif de toute la sortie du handler. Plancher de sensibilité inconditionnel.',
        prompt: 'Décris M4 (Arguments validés) et comment elle sécurise le parcours des arguments.'
      },
      {
        id: 'M5',
        title: 'M5 — Clé d\'instance',
        desc: 'Le sceau est désormais lié à l\'instance de Jarvis. Non rejouable sur une autre instance.',
        prompt: 'Comment M5 (Clé d\'instance) empêche-t-elle les attaques par rejeu entre instances?'
      },
      {
        id: 'M6',
        title: 'M6 — Compteur interne',
        desc: 'Le chemin de décision interne alimente maintenant le compteur de sondes dry-run.',
        prompt: 'Explique M6 (Compteur interne) et son rôle dans la détection d\'abus.'
      }
    ];

    let conversationHistory = [];

    // Render mitigation cards
    function renderMitigations() {
      const grid = document.getElementById('mitigationGrid');
      grid.innerHTML = mitigations.map(m => `
        <div class="mitigation-card">
          <div class="mitigation-title">✅ ${m.title}</div>
          <div class="mitigation-desc">${m.desc}</div>
          <button class="test-btn" onclick="testMitigation('${m.id}', '${m.prompt.replace(/'/g, "\\'")}')">
            Tester ${m.id}
          </button>
          <div class="response-output" id="response-${m.id}" style="display:none;"></div>
        </div>
      `).join('');
    }

    // Send chat message
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      // Add user message
      addChatMessage(message, 'user');
      input.value = '';
      input.style.height = 'auto';

      // Add loading indicator
      addChatMessage('⏳ Jarvis réfléchit...', 'loading');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: message,
            model: 'claude-3-5-sonnet-20241022',
            maxTokens: 512
          })
        });

        const data = await response.json();

        // Remove loading message
        const messages = document.querySelectorAll('.message.loading');
        messages.forEach(m => m.remove());

        if (data.success) {
          addChatMessage(data.completion, 'assistant');
          conversationHistory.push({ role: 'user', content: message });
          conversationHistory.push({ role: 'assistant', content: data.completion });
        } else {
          addChatMessage(`❌ Erreur: ${data.error}`, 'assistant');
        }
      } catch (err) {
        const messages = document.querySelectorAll('.message.loading');
        messages.forEach(m => m.remove());
        addChatMessage(`❌ Erreur réseau: ${err.message}`, 'assistant');
      }
    }

    // Add message to chat
    function addChatMessage(text, role) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // Test mitigation
    async function testMitigation(id, prompt) {
      const btn = event.target;
      btn.disabled = true;
      const outputDiv = document.getElementById(`response-${id}`);
      outputDiv.style.display = 'block';
      outputDiv.textContent = '⏳ Test en cours...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            model: 'claude-3-5-sonnet-20241022',
            maxTokens: 300
          })
        });

        const data = await response.json();
        if (data.success) {
          outputDiv.textContent = '✓ ' + data.completion;
        } else {
          outputDiv.textContent = '❌ ' + data.error;
        }
      } catch (err) {
        outputDiv.textContent = '❌ ' + err.message;
      }

      btn.disabled = false;
    }

    // Keyboard shortcut for send
    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    document.getElementById('userInput').addEventListener('input', (e) => {
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 80) + 'px';
    });

    // Initialize
    renderMitigations();
    addChatMessage('Bienvenue! Je suis Jarvis 5.28.1, assistant de gouvernance IA. Pose-moi des questions sur mes capacités, la sécurité, ou n\'importe quoi d\'autre! 🚀', 'assistant');
  </script>
</body>
</html>
