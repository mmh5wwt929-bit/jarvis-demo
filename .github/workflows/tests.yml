name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    # versions FIXEES (7 oct) : une mise a jour exterieure ne doit plus casser la CI ; monter de version = une PR a part
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Manifeste (les fichiers deposes sont ceux livres)
        run: node jarvis-manifeste.js --verifier
      - name: jsdom pour les tests de la page (jamais en production)
        run: npm install --no-save --no-audit --no-fund jsdom@30.1.2
      - name: Toutes les suites
        run: |
          echec=0
          for f in tests-*.js; do
            echo "::group::$f"
            if ! timeout 300 node "$f"; then echo "::error::$f en echec"; echec=1; fi
            echo "::endgroup::"
          done
          exit $echec
